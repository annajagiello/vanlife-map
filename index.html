  saveFavs();
  markFavs();
  return favs.has(s.id);
}
// Auto-mark a campsite, aire, camper parking, parking or rest stop as visited when the app is opened (or come back to)
// within 100 m of one, as "I've arrived". The first 90 seconds count, so the search results around you can still arrive.
// A web app gets no location in the background, so nothing happens while it is closed.
const ARRIVE_R = 100, ARRIVE_WINDOW = 90 * 1000, VISIT_KINDS = ["camping", "rv", "camperpark", "parking", "reststop"];
let lastFix = null, openedAt = Date.now();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") openedAt = Date.now(); });
function checkDwell() {
  if (!lastFix || !$("autoVisit").checked || Date.now() - openedAt >= ARRIVE_WINDOW) return;
  let best = null, bd = Infinity;
  for (const s of spots) if (VISIT_KINDS.includes(s.kind)) { const d = metersBetween(s, lastFix); if (d < bd) { bd = d; best = s; } }
  if (!best || bd > ARRIVE_R || visited.has(best.id)) return;
  openedAt = 0; // one mark per opening
  setVisited(best, true);
  toast("Marked " + best.name + " as visited", () => setVisited(best, false));
}
function watchVisits() {
  if (!navigator.geolocation) return;
  navigator.geolocation.watchPosition((pos) => {
    lastFix = { lat: pos.coords.latitude, lng: pos.coords.longitude, t: Date.now() };
    if (meMarker) meMarker.position = { lat: lastFix.lat, lng: lastFix.lng }; // the blue dot follows you
    checkDwell();
  }, () => {}, { enableHighAccuracy: false, maximumAge: 60000, timeout: 60000 });
}
let toastTimer = null;
function toast(text, undo) {
  const t = $("toast");
  t.replaceChildren(el("span", text));
  if (undo) { const b = el("button", "Undo"); b.onclick = () => { undo(); t.hidden = true; }; t.append(b); }
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.hidden = true), 8000);
}
$("autoVisit").checked = store.get("auto_visit") !== "0";
$("autoVisit").addEventListener("change", () => store.set("auto_visit", $("autoVisit").checked ? "1" : "0"));

// Visited ("been here"): kept in this browser like favourites, with the date. Marked from a spot's card (✓ button), or
// automatically, see watchVisits().
const visited = new Map((() => { try { return Object.entries(JSON.parse(store.get("visited") || "{}")); } catch { return []; } })());
const saveVisited = () => { store.set("visited", JSON.stringify(Object.fromEntries(visited))); markChanged(); };
function setVisited(s, on) {
  if (on) visited.set(s.id, { ...Object.fromEntries(FAV_KEYS.filter((k) => s[k] !== undefined).map((k) => [k, s[k]])), at: visited.get(s.id)?.at || Date.now() });
  else visited.delete(s.id);
  saveVisited();
  markFavs();
}
// A favourite only shows while its type is ticked in the settings (Van stops, Campsites, Toilets, Laundromats, Malls, Supermarkets).
const TYPE_BOX = { camping: "showCamping", toilet: "showToilets", laundry: "showLaundry", mall: "showMalls", supermarket: "showSupermarkets" };
const favTypeOn = (kind) => $(TYPE_BOX[kind] || "showVan").checked; // every other kind (aire, camper parking, parking, rest stop) is a van stop
// Star badge on every pin that is a favourite, plus a pin for each favourite that has none in the current results.
function markFavs() {
  if (!map) return;
  document.querySelectorAll(".pin[data-id]").forEach((e) => { e.classList.toggle("is-fav", favs.has(e.dataset.id)); e.classList.toggle("is-visited", visited.has(e.dataset.id)); });
  favMarkers.forEach((m) => (m.map = null));
  favMarkers = [];
  const present = new Set([...document.querySelectorAll(".pin[data-id]:not(.fav-own)")].map((e) => e.dataset.id));
  for (const id of new Set([...favs.keys(), ...visited.keys()])) { // favourites and visited places stay on the map outside the results
    const f = favs.get(id) || visited.get(id);
    if (present.has(id) || !favTypeOn(f.kind) || hiddenPois.has(id)) continue;
    const content = pin(f.source === "p4n" ? "p4n" : "google", f.name, f.kind, id);
    content.classList.add("fav-own");
    content.classList.toggle("is-fav", favs.has(id));
    content.classList.toggle("is-visited", visited.has(id));
    if (f.source === "toilet" || f.source === "poi") content.classList.add("small");
    const m = new AdvancedMarkerElement({ map, position: { lat: f.lat, lng: f.lng }, title: f.name, content, zIndex: 900 });
    m.addListener("click", () => showDetail(f));
    favMarkers.push(m);
  }
}

async function showDetail(s) {
  const seq = ++detailSeq;
  const box = $("detail");
  box.hidden = false;
  const close = el("button", "×", "close");
  close.onclick = () => { box.hidden = true; };
  const star = el("button", null, "favbtn");
  star.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 6 6.5.8-4.8 4.5 1.3 6.5L12 17.4l-5.8 3.2 1.3-6.5L2.7 9.6l6.5-.8z"/></svg>'; // drawn, not a text glyph, so it looks the same on every device
  const paintStar = () => { const on = favs.has(s.id); star.classList.toggle("on", on); star.title = star.ariaLabel = on ? "Remove from favourites" : "Add to favourites"; };
  star.onclick = () => { toggleFav(s); paintStar(); };
  paintStar();
  const head = el("h2", s.name);
  const origin = s.origin || s.source;
  const badge = el("span", origin === "p4n" ? "P" : origin === "osm" ? "OSM" : "G", "tag " + (origin === "p4n" ? "p4n" : origin === "osm" ? "osm" : "google"));
  if (origin === "osm") badge.title = "OpenStreetMap";
  const top = el("div", null, "top");
  top.append(badge, head);
  const metaText = (rating, count, loaded) => [(KINDS[s.kind] ? KINDS[s.kind].glyph + " " + KINDS[s.kind].label : ""), rating ? "★ " + rating : (loaded ? "No rating" : ""), count ? count + " reviews" : ""].filter(Boolean).join(" · ");
  const meta = el("div", metaText(s.rating, s.count, false), "meta");
  const vbtn = el("button", "✓", "visbtn");
  const paintVis = () => { const on = visited.has(s.id); vbtn.classList.toggle("on", on); vbtn.title = vbtn.ariaLabel = on ? "Visited on " + new Date(visited.get(s.id).at).toLocaleDateString() + " (tap to unmark)" : "Mark as visited"; };
  vbtn.onclick = () => { setVisited(s, !visited.has(s.id)); paintVis(); };
  paintVis();
  box.replaceChildren(close, star, vbtn, top, meta);
  if (visited.has(s.id)) box.append(el("div", "✓ Visited " + new Date(visited.get(s.id).at).toLocaleDateString(), "meta"));
  curSpot = s;
  const wbox = el("div", null); wbox.id = "wxbox";
  box.append(wbox);
  fillWxBox(s);
  loadWeather([s]);
  (s.facts || []).forEach((f) => box.append(el("div", f, "meta")));
  const info = el("div"); // opening hours, toilet and website: filled in once the place's details arrive
  box.append(info);
  if (s.typeName) box.append(el("div", "Google category: " + s.typeName + (s.inferred ? " (counted as camping because of its lodging tag or name)" : ""), "meta"));
  if (s.website) { const w = el("a", "Website: " + siteName(s.website) + " ↗", "site"); w.href = s.website; w.target = "_blank"; w.rel = "noopener noreferrer"; const wp = el("p"); wp.append(w); box.append(wp); }
  if (s.url) { const a = el("a", "Open in " + (s.source === "p4n" ? "Park4night" : s.origin === "osm" ? "OpenStreetMap" : "Google Maps")); a.href = s.url; a.target = "_blank"; a.rel = "noopener"; const p = el("p"); p.append(a); box.append(p); }
  { // every kind of place can be hidden for good (kept in this browser, like favourites)
    const row = el("p");
    const btn = el("button", "Hide this place");
    const apply = () => { // take the pin off or put it back, without a new search where possible
      if (s.source === "poi") { if (hiddenPois.has(s.id)) poiMarkers[s.kind].filter((m) => m.poiId === s.id).forEach((m) => (m.map = null)); else loadPoi(s.kind, map.getBounds()); }
      else if (s.source === "toilet") drawToilets(toiletLists[s.origin] || [], s.origin);
      else if (hiddenPois.has(s.id)) { // remove just this pin and list row: a full redraw would close this card and its Undo
        const m = markers.get(s.id); if (m) { m.map = null; markers.delete(s.id); }
        document.querySelector('#list li[data-id="' + CSS.escape(s.id) + '"]')?.remove();
      } else render();
      markFavs();
    };
    btn.onclick = () => {
      hiddenPois.add(s.id); saveHiddenPois(); apply();
      row.replaceChildren(el("span", "Hidden. ", "meta"));
      const undo = el("button", "Undo");
      undo.onclick = () => { hiddenPois.delete(s.id); saveHiddenPois(); apply(); row.replaceChildren(el("span", "Restored.", "meta")); };
      row.append(undo);
    };
    row.append(btn);
    box.append(row);
  }
  if (s.source !== "google" && s.source !== "poi") return; // toilets have no description or reviews
  const note = el("p", "Loading details and reviews…", "meta");
  box.append(note);
  try {
    let d = detailCache.get(s.placeId);
    if (!d) {
      const place = new Place({ id: s.placeId });
      await place.fetchFields({ fields: DETAIL_FIELDS });
      d = { summary: place.editorialSummary || "", reviews: place.reviews || [], rating: place.rating, count: place.userRatingCount, open: isOpenNow(place), website: safeUrl(place.websiteURI), toilet: place.hasRestroom };
      detailCache.set(s.placeId, d);
    }
    if (seq !== detailSeq) return; // a newer tap took over
    Object.assign(s, { rating: d.rating, count: d.count, open: d.open, toilet: d.toilet, website: s.website || d.website });
    meta.textContent = metaText(d.rating, d.count, true);
    info.append(el("div", d.open === true ? "Open now" : d.open === false ? "Closed now" : "Opening hours not listed by Google", "meta" + (d.open === false ? " closed" : "")));
    if (d.toilet === true) info.append(el("div", "🚻 Toilet available (per Google)", "meta"));
    else if (d.toilet === false) info.append(el("div", "No toilet (per Google)", "meta"));
    if (d.website && !box.querySelector("a.site")) { const w = el("a", "Website: " + siteName(d.website) + " ↗", "site"); w.href = d.website; w.target = "_blank"; w.rel = "noopener noreferrer"; const wp = el("p"); wp.append(w); info.append(wp); }
    note.remove();
    box.append(el("p", d.summary || "No description from Google for this place."));
    // Google returns at most 5 reviews (most relevant); show the 2 newest of those.
    const newest = [...d.reviews].sort((a, b) => (b.publishTime ?? 0) - (a.publishTime ?? 0)).slice(0, 2);
    box.append(el("strong", "Newest reviews"));
    if (!newest.length) box.append(el("p", "No reviews returned.", "meta"));
    for (const r of newest) {
      const wrap = el("div", null, "rev");
      wrap.append(el("div", stars(r.rating) + "  " + (r.relativePublishTimeDescription || ""), "meta"));
      const t = r.text || r.originalText || "";
      wrap.append(el("div", t.length > 320 ? t.slice(0, 320) + "…" : (t || "(no text)")));
      wrap.append(el("div", "— " + (r.authorAttribution?.displayName || "Google user"), "meta"));
      box.append(wrap);
    }
  } catch (e) {
    note.textContent = "Could not load details: " + e.message;
  }
}

document.querySelectorAll("#wxopts button").forEach((b) => (b.disabled = true)); // until Heat map is ticked
paintOsmStats();
// Settings survive closing the app: the spot types, heat map and what it shows, and whether the control bar is hidden.
// The weather day is not kept: the app opens on today.
function restoreSettings() {
  let st;
  try { st = JSON.parse(store.get(SETTINGS_KEY) || "{}"); } catch { st = {}; }
  SETTING_BOXES.forEach((id) => { if (typeof st[id] === "boolean") $(id).checked = st[id]; });
  if (["max", "min", "rain"].includes(st.mode)) { heatMode = st.mode; document.querySelectorAll("#hl button, #mapMode button").forEach((x) => x.classList.toggle("on", x.dataset.m === st.mode)); }
  if ($("heatOn").checked) $("heatOn").onchange(); // shows the day / mode options; the map draws the heat map once it is ready
  if (st.panelHidden) document.body.classList.add("nopanel");
}
restoreSettings();
SETTING_BOXES.forEach((id) => $(id).addEventListener("change", saveSettings));

// Account (optional): "Sign in with Google" keeps favourites, visited and hidden places and settings in the user's own
// record on the server (account.js), so they follow the user to other devices. Without it everything stays on this device.
// Rule for two devices: whichever copy was changed last wins; the very first sign-in merges this device into the account.
const API_BASE = location.hostname === "localhost" ? "https://vanlife-map.annajagiello.workers.dev" : "";
const GOOGLE_CLIENT_ID = "988770051891-dr9ava1do6jdn13j4tfeodltpj46dst0.apps.googleusercontent.com";
const localDoc = () => ({ favs: Object.fromEntries(favs), visited: Object.fromEntries(visited), hidden: [...hiddenPois], settings: JSON.parse(store.get(SETTINGS_KEY) || "{}") });
async function api(path, opts = {}) {
  const r = await fetch(API_BASE + path, { ...opts, headers: { "Content-Type": "application/json", ...(session ? { Authorization: "Bearer " + session } : {}) } });
  if (r.status === 401 && session && path !== "/api/login") signedOut(); // session expired or account deleted elsewhere
  return r;
}
async function pushDoc() {
  if (!session) return;
  const updated = Number(store.get("local_updated")) || Date.now();
  const r = await api("/api/data", { method: "PUT", body: JSON.stringify({ doc: localDoc(), updated }) }).catch(() => null);
  if (r && r.ok) store.set("synced_at", String(updated));
  paintAcct();
}
function applyDoc(doc, merge) {
  applyingDoc = true;
  try {
    if (!merge) { favs.clear(); visited.clear(); hiddenPois.clear(); }
    for (const [k, v] of Object.entries(doc.favs || {})) if (!favs.has(k)) favs.set(k, v);
    for (const [k, v] of Object.entries(doc.visited || {})) { const cur = visited.get(k); if (!cur || (v.at && v.at < cur.at)) visited.set(k, v); } // keep the first visit date
    (doc.hidden || []).forEach((id) => hiddenPois.add(id));
    saveFavs(); saveVisited(); saveHiddenPois();
    if (!merge && doc.settings && Object.keys(doc.settings).length) { store.set(SETTINGS_KEY, JSON.stringify(doc.settings)); restoreSettings(); }
  } finally { applyingDoc = false; }
  if (map) { render(); markFavs(); }
}
async function syncAccount(firstLogin) {
  const r = await api("/api/data").catch(() => null);
  if (!r || !r.ok) { paintAcct(); return; }
  const { doc, updated } = await r.json();
  const localUpdated = Number(store.get("local_updated")) || 0;
  if (firstLogin) { if (doc) applyDoc(doc, true); store.set("local_updated", String(Date.now())); await pushDoc(); }
  else if (doc && updated > localUpdated) { applyDoc(doc, false); store.set("local_updated", String(updated)); store.set("synced_at", String(updated)); }
  else if (localUpdated > updated) await pushDoc();
  paintAcct();
}
function onGoogleCredential(resp) {
  api("/api/login", { method: "POST", body: JSON.stringify({ credential: resp.credential }) })
    .then(async (r) => {
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { toast("Sign-in failed: " + (j.error || "HTTP " + r.status)); return; }
      session = j.session; acctName = j.name || "";
      store.set("session", session); store.set("acct_name", acctName);
      toast("Signed in" + (acctName ? " as " + acctName : ""));
      if (onboardStep === 2) { onboardStep = 3; paintOnboarding(); }
      syncAccount(true);
    })
    .catch((e) => toast("Sign-in failed: " + e.message));
}
function signedOut() { session = ""; store.set("session", ""); store.set("acct_name", ""); paintAcct(); }
let gsiState = "";
function loadGsi() {
  if (gsiState) return;
  gsiState = "loading";
  const sc = document.createElement("script");
  sc.src = "https://accounts.google.com/gsi/client"; sc.async = true;
  sc.onload = () => { google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogleCredential, use_fedcm_for_prompt: true }); gsiState = "ready"; paintAcct(); if (onboardStep === 2) paintOnboarding(); };
  sc.onerror = () => { gsiState = ""; const b = $("acct"); if (b) b.append(el("div", "Google sign-in could not load. Check the connection and reopen Settings.", "meta")); };
  document.head.append(sc);
}
function paintAcct() {
  const box = $("acct");
  if (!box) return;
  box.replaceChildren();
  if (!session) {
    box.append(el("div", "Sign in to keep favourites, visited and hidden places and your settings on all your devices. Only an anonymous account number is stored, no email.", "meta"));
    const btn = el("div");
    box.append(btn);
    if (gsiState === "ready") google.accounts.id.renderButton(btn, { theme: "outline", size: "medium", text: "signin_with" });
    else loadGsi();
    return;
  }
  const synced = Number(store.get("synced_at")) || 0;
  box.append(el("div", "Signed in" + (acctName ? " as " + acctName : "") + (synced ? " · synced " + new Date(synced).toLocaleString([], { dateStyle: "short", timeStyle: "short" }) : ""), "meta"));
  const row = el("div", null, "row");
  const out = el("button", "Sign out");
  out.onclick = async () => { await api("/api/logout", { method: "POST" }).catch(() => {}); signedOut(); };
  const del = el("button", "Delete my account and data");
  let armed = false; // two taps instead of a confirm dialog
  del.onclick = async () => {
    if (!armed) { armed = true; del.textContent = "Tap again to delete everything"; setTimeout(() => { armed = false; del.textContent = "Delete my account and data"; }, 5000); return; }
    const r = await api("/api/account", { method: "DELETE" }).catch(() => null);
    if (r && r.ok) { signedOut(); toast("Account and its saved data deleted. This device keeps its own copy."); }
    else toast("Could not delete the account. Try again.");
  };
  row.append(out, del);
  box.append(row);
}
// First launch: three short steps (welcome, sign in, location), shown once per device.
let onboardStep = 0;
function showOnboarding() { onboardStep = 1; paintOnboarding(); }
function finishOnboarding() { store.set("onboarded", "1"); onboardStep = 0; $("onboard").hidden = true; }
function paintOnboarding() {
  const box = $("onboard");
  if (!onboardStep) { box.hidden = true; return; }
  const card = el("div", null, "card");
  const dots = el("div", null, "dots");
  [1, 2, 3].forEach((i) => dots.append(el("span", null, i === onboardStep ? "on" : "")));
  if (onboardStep === 1) {
    const img = document.createElement("img"); img.src = "icon.svg"; img.alt = "";
    const go = el("button", "Get started", "primary");
    go.onclick = () => { onboardStep = session ? 3 : 2; paintOnboarding(); };
    card.append(img, el("h2", "Vanlife Map"), el("p", "Find van parking spots, toilets, supermarkets and laundries, then plan your next move according to the weather map."), go);
  } else if (onboardStep === 2) {
    const btn = el("div");
    const skip = el("button", "Continue without account", "skip");
    skip.onclick = () => { onboardStep = 3; paintOnboarding(); };
    card.append(el("h2", "Keep your places"), el("p", "Sign in with Google to keep your favourites, visited and hidden places on all your devices. You can also do this later in Settings."), btn, skip);
    if (gsiState === "ready") google.accounts.id.renderButton(btn, { theme: "filled_blue", size: "large", text: "signin_with", shape: "pill" });
    else loadGsi();
  } else {
    const allow = el("button", "Allow location", "primary");
    allow.onclick = () => { finishOnboarding(); locate(); watchVisits(); };
    const later = el("button", "Not now", "skip");
    later.onclick = () => { finishOnboarding(); setStatus("Use the 📍 button or the search box to find spots."); };
    card.append(el("h2", "Spots near you"), el("p", "Allow location to see spots around you and to mark the places you stay at as visited. It is used only while the app is open."), allow, later);
  }
  card.append(dots);
  box.replaceChildren(card);
  box.hidden = false;
}

// Google Maps key: the app's built-in key by default; your own key (e.g. for testing) can be set in Settings.
function paintKeyChoice() {
  const box = $("keyChoice");
  if (!box) return;
  const own = !!store.get("gmaps_key");
  const btn = el("button", own ? "Use the app's Google key" : "Use my own Google key…");
  btn.onclick = () => {
    if (own) { try { localStorage.removeItem("gmaps_key"); } catch { /* storage blocked */ } location.reload(); }
    else { $("keybox").hidden = false; setSheet(false); $("key").focus(); }
  };
  box.replaceChildren(el("div", "Google Maps key: " + (own ? "your own (saved on this device)" : "the app's"), "meta"), btn);
}

paintAcct();
paintKeyChoice();
if (session) syncAccount(false);
init();
// Installable app: the service worker needs https (or localhost).
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
